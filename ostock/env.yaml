apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: env
  namespace: ostock
spec:
  interval: 10m
  path: ./ostock/overlays/${ENVIRONMENT}
  prune: true
  sourceRef:
    kind: GitRepository
    name: projects
    namespace: ${ENVIRONMENT}
  postBuild:
    substitute:
      ENVIRONMENT: ${ENVIRONMENT}
      IMAGE_REGISTRY_HOST: ${IMAGE_REGISTRY_HOST}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_SCHEME}://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/ostock
