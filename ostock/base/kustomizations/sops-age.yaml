apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sops-age
  namespace: ostock
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  timeout: 10m
  path: ./${ENVIRONMENT}/sops-age
  prune: true
  sourceRef:
    kind: GitRepository
    name: secrets
