apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: organization-service
  namespace: ostock
  labels:
    category: microservice
spec:
  providerRef:
    name: git-event-listener
  inclusionList:
    - "^stored artifact for commit '.*'$"
  eventSeverity: info
  eventMetadata:
    pipelineName: maven-helm
    pipelineNamespace: cicd
    eventListenerAddress: http://el-maven-helm.cicd.svc.cluster.local:8080
    mavenContextDir: .
    helmChartRepoUrl: git@github.com:biya-bi/ostock-helm.git
    helmChartRepoRevision: develop
    helmChartReleaseNamespace: ostock
    chartsDir: .
    chartContext: organization-service
    environment: ${ENVIRONMENT}
  eventSources:
    - kind: GitRepository
      name: organization-service
