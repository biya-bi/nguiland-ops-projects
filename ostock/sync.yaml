apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ostock
  namespace: ${ENVIRONMENT}
spec:
  interval: 10m
  timeout: 10m
  path: .
  prune: true
  sourceRef:
    kind: GitRepository
    name: ostock
    namespace: ${ENVIRONMENT}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: env-settings
