apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: helm-chart-oci-publish
  namespace: cicd
spec:
  providerRef:
    name: git-event-listener
  inclusionList:
    - "^stored artifact for commit '.*'$"
    - "^no changes since last reconcilation'.*'$"
  eventSeverity: info
  eventMetadata:
    chartsDir: addons
    excludedCharts: cronjob-common
    registry: oci://${IMAGE_REGISTRY_HOST}/docker-local
    pipelineName: helm-chart-oci-publish
    eventListenerAddress: http://el-helm-chart-oci-publish.cicd.svc.cluster.local:8080/
  eventSources:
    - kind: GitRepository
      name: nguiland-ops-helm
